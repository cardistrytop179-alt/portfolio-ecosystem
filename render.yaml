services:
  - type: web
    name: miron-portfolio-backend
    env: node
    plan: starter
    region: oregon
    root: backend
    branch: main
    buildCommand: yarn install && yarn build
    startCommand: node dist/server.js
    autoDeploy: true
    healthCheckPath: /health
    # Do NOT store secrets here. Set BOT_TOKEN, DATABASE_URL, ADMIN_ID, FRONTEND_URL and other secrets in Render dashboard.
