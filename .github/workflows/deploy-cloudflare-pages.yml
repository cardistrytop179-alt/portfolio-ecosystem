name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        working-directory: ./frontend
        # `npm install` (not `npm ci`) because we intentionally do not commit
        # frontend/package-lock.json: Windows-generated locks omit Linux-only
        # rollup native bindings (@rollup/rollup-linux-x64-gnu) and break CI.
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          npx wrangler@latest pages publish frontend/dist --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch=main
